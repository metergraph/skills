name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Validate skills
        run: node scripts/validate.mjs

      - name: Build skill archives
        run: sh scripts/package.sh

  skills-installer:
    name: Install with npx skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Installs this checkout the way `npx skills add metergraph/skills` does,
      # into a scratch project, and checks every skill landed for each agent.
      - name: Install every skill for Claude Code, Codex and Cursor
        run: |
          set -eu
          SRC="$PWD"
          PROJECT="$RUNNER_TEMP/project"
          mkdir -p "$PROJECT"
          cd "$PROJECT"
          npx --yes skills@1.7.1 add "$SRC" --skill '*' --agent claude-code codex cursor --copy --yes
          for dir in "$SRC"/skills/*/; do
            name=$(basename "$dir")
            for target in .claude/skills .agents/skills; do
              cmp "$SRC/skills/$name/SKILL.md" "$target/$name/SKILL.md"
            done
          done
          echo "Installed: $(ls .claude/skills | tr '\n' ' ')"
