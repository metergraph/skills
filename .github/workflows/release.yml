name: Release

# Publishes one zip per skill, for clients that install skills by upload, on a
# version tag such as v0.5.0. The tag must match .claude-plugin/plugin.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Validate skills
        run: node scripts/validate.mjs

      - name: Check the tag matches the plugin version
        run: |
          VERSION=$(node -p 'require("./.claude-plugin/plugin.json").version')
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Build skill archives
        run: sh scripts/package.sh

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
